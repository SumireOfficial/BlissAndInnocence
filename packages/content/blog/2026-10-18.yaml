announcer: Eyhz
message: |
  We are happy to announce the release of our first double album, Verdict! Originally a single album project based around light and dark, we challanged producers to create something fitting either theme. Due to a large ammount of submissions and a special phone wallpaper size artwork by lesyef, we have decided to split it into two seperate works.

  You can download the albums Here:
  Verdict Lux: https://blissandinnocence.bandcamp.com/album/verdict-lux
  Verdict Nox: https://blissandinnocence.bandcamp.com/album/verdict-nox